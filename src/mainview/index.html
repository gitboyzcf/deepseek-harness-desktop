<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Harness</title>
    <link href="./index.css" type="text/css" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>

      <div class="card">
        <div class="brand">
          <img class="logo" src="./logo.png" alt="DeepSeek Harness" />
          <h1>DeepSeek <span>Harness</span></h1>
          <p class="subtitle">桌面客户端</p>
        </div>

        <div class="status" id="status">正在初始化…</div>
        <p class="hint hidden" id="hint"></p>

        <div class="bar" id="bar"><div class="bar-fill"></div></div>

        <button id="retry" class="retry hidden" type="button">重试</button>

        <details class="logs">
          <summary>运行日志</summary>
          <pre id="log"></pre>
        </details>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
