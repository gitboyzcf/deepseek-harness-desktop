name: Release

# 全自动发版流水线(electrobun 版):
#   每天定时检查 npm 上 @deepseek-ai/dsh 是否有新版本;
#   有 → 在 Windows / macOS / Linux 三个平台原生构建(便携 Node 与 dsh 原生模块都是平台相关的),
#        安装包发到版本 Release, 差分更新文件(update.json/patch/tar.zst)发到浮动的 latest Release;
#   老客户端通过内置 Updater 从 latest 通道差分更新。
on:
  schedule:
    - cron: '0 2 * * *' # 每天 10:00 (北京时间)
  workflow_dispatch:
    inputs:
      force:
        description: '忽略版本比对, 强制重新发版'
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: DeepSeek-Harness

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      dsh_version: ${{ steps.check.outputs.dsh_version }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          set -e
          LATEST=$(curl -fsSL "https://registry.npmjs.org/@deepseek-ai/dsh/latest" | jq -r .version)
          CURRENT=$(cat dsh-runtime.version | tr -d '[:space:]')
          # 三个平台必须共用同一个应用版本号, 统一在这里 bump 后下发
          NEW_APP_VERSION=$(node -e "const p=require('./package.json');const [a,b,c]=p.version.split('.').map(Number);console.log([a,b,c+1].join('.'))")
          echo "npm 最新版本: $LATEST / 仓库内置版本: $CURRENT / 即将发布: v$NEW_APP_VERSION"
          echo "dsh_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "app_version=$NEW_APP_VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-glob: '*.exe'
          - os: macos-latest
            artifact-glob: '*.tar.zst'
          - os: ubuntu-latest
            artifact-glob: '*.tar.zst'
    runs-on: ${{ matrix.os }}
    env:
      DSH_VERSION: ${{ needs.check-update.outputs.dsh_version }}
      APP_VERSION: ${{ needs.check-update.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Prepare runtime (portable Node + dsh, 平台原生)
        run: node scripts/prepare-runtime.mjs --force

      - name: Set app version & record dsh version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "const fs=require('fs');const f='electrobun.config.ts';let s=fs.readFileSync(f,'utf8');s=s.replace(/version: \"[^\"]+\"/, \`version: \"\${process.env.APP_VERSION}\`\");fs.writeFileSync(f,s)"
          node -e "require('fs').writeFileSync('dsh-runtime.version', process.env.DSH_VERSION + '\n')"

      # Windows runner 上 GNU tar 会把 D: 盘符当远程主机, 前插 System32 bsdtar 的 shim
      - name: tar shim (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .ci-shim
          printf '@"C:\\Windows\\System32\\tar.exe" %%*\n' > .ci-shim/tar.cmd
          echo "$PWD/.ci-shim" >> "$GITHUB_PATH"

      - name: Build (electrobun stable)
        run: bunx electrobun build --env=stable

      - name: 上传安装包到版本 Release
        run: |
          gh release create "v$APP_VERSION" --title "v$APP_VERSION" --notes "dsh $DSH_VERSION" dist/* || true
          gh release upload "v$APP_VERSION" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传差分更新文件到浮动 latest Release
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "latest" --notes "差分更新通道, 客户端自动更新用, 勿手动下载" --latest=false
          gh release upload latest dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-bump:
    needs: [check-update, build]
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: ${{ needs.check-update.outputs.dsh_version }}
      APP_VERSION: ${{ needs.check-update.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "const fs=require('fs');const f='electrobun.config.ts';let s=fs.readFileSync(f,'utf8');s=s.replace(/version: \"[^\"]+\"/, \`version: \"\${process.env.APP_VERSION}\`\");fs.writeFileSync(f,s)"
          node -e "require('fs').writeFileSync('dsh-runtime.version', process.env.DSH_VERSION + '\n')"
          git add package.json electrobun.config.ts dsh-runtime.version
          git commit -m "chore(release): v${{ env.APP_VERSION }}, bundle dsh ${{ env.DSH_VERSION }} [skip ci]"
          git push
