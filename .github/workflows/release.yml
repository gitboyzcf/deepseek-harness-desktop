name: Release

# 全自动发版流水线:
#   每天定时检查 npm 上 @deepseek-ai/dsh 是否有新版本;
#   有 → 在 Windows / macOS / Linux 三个平台原生打包(各平台内置对应平台的便携 Node 与 dsh 原生模块),
#        发布到同一个 GitHub Release;
#   老用户的客户端通过 electron-updater 自动收到更新。
#
# 注意: 无法在本机交叉构建 —— resources/runtime 里的便携 Node 和 node-pty/koffi/sharp
#       等原生模块都是平台相关的, 必须在对应平台的 runner 上原生构建。
on:
  schedule:
    - cron: '0 2 * * *' # 每天 10:00 (北京时间)
  workflow_dispatch:
    inputs:
      force:
        description: '忽略版本比对, 强制重新发版'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      dsh_version: ${{ steps.check.outputs.dsh_version }}
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          set -e
          LATEST=$(curl -fsSL "https://registry.npmjs.org/@deepseek-ai/dsh/latest" | jq -r .version)
          CURRENT=$(cat dsh-runtime.version | tr -d '[:space:]')
          # 三个平台必须共用同一个应用版本号, 统一在这里 bump 后下发
          NEW_APP_VERSION=$(node -e "const p=require('./package.json');const [a,b,c]=p.version.split('.').map(Number);console.log([a,b,c+1].join('.'))")
          echo "npm 最新版本: $LATEST / 仓库内置版本: $CURRENT / 即将发布: v$NEW_APP_VERSION"
          echo "dsh_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "app_version=$NEW_APP_VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-flag: --win
          - os: macos-latest
            builder-flag: --mac
          - os: ubuntu-latest
            builder-flag: --linux
    runs-on: ${{ matrix.os }}
    env:
      DSH_VERSION: ${{ needs.check-update.outputs.dsh_version }}
      APP_VERSION: ${{ needs.check-update.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare runtime (portable Node + dsh, 平台原生)
        run: node scripts/prepare-runtime.mjs --force

      - name: Set app version & record dsh version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('版本:',p.version)"
          node -e "require('fs').writeFileSync('dsh-runtime.version', process.env.DSH_VERSION + '\n')"

      - name: Build app (electron-vite)
        run: pnpm build

      - name: Build & publish release
        # 三个矩阵任务并发发布到同一个 Release: electron-builder 对"Release 已存在"有重试处理
        run: pnpm exec electron-builder ${{ matrix.builder-flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-bump:
    needs: [check-update, build]
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: ${{ needs.check-update.outputs.dsh_version }}
      APP_VERSION: ${{ needs.check-update.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node -e "require('fs').writeFileSync('dsh-runtime.version', process.env.DSH_VERSION + '\n')"
          git add package.json dsh-runtime.version
          git commit -m "chore(release): v${{ env.APP_VERSION }}, bundle dsh ${{ env.DSH_VERSION }} [skip ci]"
          git push
